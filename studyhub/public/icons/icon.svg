<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>

  <!-- Glass shine -->
  <path d="M0 120 Q0 0 120 0 L392 0 Q512 0 512 120 L512 280 Q392 210 256 210 Q120 210 0 280 Z" fill="url(#shine)"/>

  <!-- Letter S — tebal, jelas di semua ukuran -->
  <path
    d="M 348 148
       C 348 70, 148 70, 148 184
       C 148 258, 364 238, 364 332
       C 364 430, 164 430, 164 354"
    stroke="white"
    stroke-width="52"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
</svg>
