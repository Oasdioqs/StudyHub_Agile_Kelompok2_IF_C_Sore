<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Main gradient: indigo → purple (sesuai warna StudyHub) -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="60%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <!-- Glass shine di bagian atas -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <!-- Subtle inner shadow -->
    <filter id="inner" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" result="blur"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="48" height="48" rx="12" fill="url(#bg)"/>

  <!-- Glass highlight (top half) -->
  <path d="M0 12 Q0 0 12 0 L36 0 Q48 0 48 12 L48 26 Q36 20 24 20 Q12 20 0 26 Z" fill="url(#shine)"/>

  <!-- Huruf S — custom stroke path -->
  <!-- Top arc: kanan → kiri -->
  <!-- Middle: kiri → kanan -->
  <!-- Bottom arc: kanan → kiri -->
  <path
    d="M 33 14
       C 33 7, 14 7, 14 17
       C 14 24, 34 22, 34 31
       C 34 41, 15 41, 15 34"
    stroke="white"
    stroke-width="4.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
    opacity="0.97"
  />

  <!-- Accent dots kecil di pojok kanan atas -->
  <circle cx="39" cy="9" r="1.8" fill="white" opacity="0.45"/>
  <circle cx="43" cy="13" r="1" fill="white" opacity="0.25"/>
</svg>
